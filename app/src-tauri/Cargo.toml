[package]
name = "vaquita"
version = "0.1.0"
description = "Desktop GUI for the vaquita daemon"
authors = ["zeikar"]
license = "MIT"
repository = "https://github.com/zeikar/vaquita"
edition = "2024"

[lib]
# macOS desktop only, so the staticlib/cdylib crate types that mobile builds
# need are left out.
name = "vaquita_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
sha2 = "0.11.1"
libc = "0.2.191"
# UNUserNotificationCenter, for notifications whose clicks reach the app; the
# versions tauri already depends on.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSDictionary", "NSError", "NSObject", "NSString", "NSUUID", "NSValue"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
