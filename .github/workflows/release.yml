name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - name: Check signing secrets
        env:
          VAQUITA_SIGN_P12: ${{ secrets.VAQUITA_SIGN_P12 }}
          VAQUITA_SIGN_P12_PASSWORD: ${{ secrets.VAQUITA_SIGN_P12_PASSWORD }}
          VAQUITA_SIGN_IDENTITY: ${{ secrets.VAQUITA_SIGN_IDENTITY }}
          VAQUITA_UPDATER_KEY: ${{ secrets.VAQUITA_UPDATER_KEY }}
          VAQUITA_UPDATER_KEY_PASSWORD: ${{ secrets.VAQUITA_UPDATER_KEY_PASSWORD }}
        run: |
          missing=0
          for name in VAQUITA_SIGN_P12 VAQUITA_SIGN_P12_PASSWORD VAQUITA_SIGN_IDENTITY \
            VAQUITA_UPDATER_KEY VAQUITA_UPDATER_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set; a release must be signed."
              missing=1
            fi
          done
          exit "$missing"

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-prerelease."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release notes open with the version's section of CHANGELOG.md, the
      # lines under its "## <version>" heading. A release needs one; a
      # prerelease may go without.
      - name: Read changelog
        run: |
          awk -v want="## $VERSION" '$0 == want { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
            if [[ "$VERSION" == *-* ]]; then
              echo "::warning::CHANGELOG.md has no section for $VERSION."
            else
              echo "::error::CHANGELOG.md has no section for $VERSION; add one before tagging."
              exit 1
            fi
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target

      - name: Test daemon
        working-directory: daemon
        run: go test ./...

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test app
        working-directory: app
        run: |
          npm test
          npm run check

      # The build signs vaquitad (beforeBuildCommand, through the Makefile)
      # before Tauri's bundler runs, so the certificate must already be in a
      # keychain on the search list.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.VAQUITA_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.VAQUITA_SIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/vaquita-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it first on the user search list, keeping the existing ones.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $existing

      # VERSION, from the tag, also reaches the Makefile, which stamps it and
      # a fingerprint of the daemon's code into vaquitad as its build. Only release builds update, which is why the
      # updater endpoint is set here and not in tauri.conf.json; GitHub's
      # /releases/latest/ skips prereleases, so an rc never reaches users.
      - name: Build
        working-directory: app
        env:
          VAQUITA_SIGN_IDENTITY: ${{ secrets.VAQUITA_SIGN_IDENTITY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.VAQUITA_SIGN_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.VAQUITA_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.VAQUITA_UPDATER_KEY_PASSWORD }}
        run: |
          config="$(jq -nc --arg version "$VERSION" '{
            version: $version,
            bundle: { createUpdaterArtifacts: true },
            plugins: { updater: { endpoints: [
              "https://github.com/zeikar/vaquita/releases/latest/download/latest.json"
            ] } }
          }')"
          npx tauri build --config "$config"

      # The bundler always archives the macOS app here, its signature beside
      # it. The archive is what the updater installs, so the checks below run
      # on what it unpacks to as well as on the app that goes into the zip.
      - name: Unpack updater archive
        run: |
          TARBALL=app/src-tauri/target/release/bundle/macos/vaquita.app.tar.gz
          for path in "$TARBALL" "$TARBALL.sig"; do
            if [ ! -f "$path" ]; then
              echo "::error::$path is missing; the build made no updater archive."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/updater"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/updater"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "UPDATER_APP=$RUNNER_TEMP/updater/vaquita.app" >> "$GITHUB_ENV"

      - name: Verify signatures
        env:
          IDENTITY: ${{ secrets.VAQUITA_SIGN_IDENTITY }}
        run: |
          check() {
            local path="$1" want_id="$2" info
            info="$(codesign -dv --verbose=2 "$path" 2>&1)"
            echo "$info"
            if [ -n "$want_id" ] && ! grep -qxF "Identifier=$want_id" <<< "$info"; then
              echo "::error::$path: expected Identifier=$want_id"
              exit 1
            fi
            if ! grep -qxF "Authority=$IDENTITY" <<< "$info"; then
              echo "::error::$path: expected Authority=$IDENTITY"
              exit 1
            fi
          }
          for APP in app/src-tauri/target/release/bundle/macos/vaquita.app "$UPDATER_APP"; do
            check "$APP/Contents/MacOS/vaquitad" io.github.zeikar.vaquitad
            check "$APP" ""
            codesign --verify --deep --strict --verbose=2 "$APP"
          done

      # The app replaces a running daemon whose build names other daemon code
      # than the vaquitad inside it: the build is VERSION, a +, and the
      # fingerprint daemon/Makefile takes of the daemon's committed files.
      - name: Verify daemon build
        run: |
          fingerprint="$(git -C daemon ls-tree -r HEAD . | grep -v '_test\.go$' | git hash-object --stdin | cut -c1-12)"
          want="$VERSION+$fingerprint"
          for APP in app/src-tauri/target/release/bundle/macos/vaquita.app "$UPDATER_APP"; do
            got="$("$APP/Contents/MacOS/vaquitad" version)"
            if [ "$got" != "$want" ]; then
              echo "::error::The vaquitad in $APP reports build $got, not $want."
              exit 1
            fi
          done

      # The updater on the Mac checks the signature against the pubkey in
      # tauri.conf.json, and (requireSignedVersion) that the signed version is
      # the feed's. Catch a wrong key or version here, before users do.
      - name: Verify updater signature
        run: |
          # The .sig is base64 of a minisign signature file.
          sig="$(base64 --decode < "$TARBALL.sig")"
          trusted="$(sed -n 's/^trusted comment: //p' <<< "$sig")"
          if ! tr '\t' '\n' <<< "$trusted" | grep -qxF "version:$VERSION"; then
            echo "::error::$TARBALL.sig does not sign version $VERSION (trusted comment: ${trusted:-none})."
            exit 1
          fi

          # Bytes 2-9 of a minisign signature or key line are its key id. The
          # config value is the .pub file's content, itself base64 of the key
          # text, so it is decoded once more.
          key_id() { base64 --decode | od -An -tx1 -j2 -N8 | tr -d ' \n'; }
          got="$(sed -n 2p <<< "$sig" | key_id)"
          want="$(jq -r .plugins.updater.pubkey app/src-tauri/tauri.conf.json \
            | base64 --decode | sed -n 2p | key_id)"
          if [ "${#want}" -ne 16 ]; then
            echo "::error::Could not read the key id of plugins.updater.pubkey in tauri.conf.json."
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::The updater archive is signed with key ${got:-unknown}, but tauri.conf.json trusts $want; VAQUITA_UPDATER_KEY is likely not the private half of that pubkey."
            exit 1
          fi

      - name: Package
        run: |
          ZIP="vaquita-$VERSION-macos-arm64.zip"
          ditto -c -k --keepParent app/src-tauri/target/release/bundle/macos/vaquita.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          # latest.json is the feed the app polls; it points at the archive in
          # this release. The signature goes in without a trailing newline, as
          # the updater base64-decodes it strictly.
          ARCHIVE="vaquita-$VERSION-macos-arm64.app.tar.gz"
          cp "$TARBALL" "$ARCHIVE"
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes "$RUNNER_TEMP/changes.md" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/zeikar/vaquita/releases/download/$GITHUB_REF_NAME/$ARCHIVE" \
            --arg signature "$(cat "$TARBALL.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: { "darwin-aarch64": { url: $url, signature: $signature } }
            }' > latest.json
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "FEED=latest.json" >> "$GITHUB_ENV"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
              echo "## What's changed"
              cat "$RUNNER_TEMP/changes.md"
              printf '\n---\n\n'
            fi
            cat <<'NOTES'
          Apple Silicon only. The app is signed with a self-signed certificate and is not notarized.

          Install: unzip, move `vaquita.app` to `/Applications`, then run this once to clear the quarantine flag (recursive, so the embedded daemon is cleared too):

          ```sh
          xattr -dr com.apple.quarantine /Applications/vaquita.app
          ```

          Update: vaquita checks for a newer release after launch and every six hours and offers it in a bar; one click installs it and relaunches vaquita, and your sessions stay. From 0.1.3 or earlier, update by hand once: quit vaquita, replace the app in Finder and open it. Either way, the app replaces the older daemon with its own, by itself when no session is running, else (and always for a daemon from 0.1.0-rc.3 or earlier) once you confirm. Do not `cp -R` over it while the daemon runs.

          The app installs and starts its daemon (a LaunchAgent; nothing starts at login) by itself.

          ---

          NOTES
          } > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" "$ARCHIVE" "$FEED" \
            --verify-tag \
            --title "vaquita $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${flags[@]}"

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/signing.p12"
