name: test

on:
  # With only branches named, a tag push does not run this; release.yml
  # tests a tag itself.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run's result moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target

      - name: Test daemon
        working-directory: daemon
        run: go test ./...

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test app
        working-directory: app
        run: |
          npm test
          npm run check

      # No ../dist is needed: without the custom-protocol feature the build is
      # a dev one, and generate_context! embeds nothing when devUrl is set.
      # The #[ignore]d tests stay out: two wait on real FSEvents and are
      # run by hand, as for release.yml; one is a stand-in another test runs.
      - name: Test app (Rust)
        working-directory: app/src-tauri
        run: cargo test
